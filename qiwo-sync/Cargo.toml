[package]
name = "qiwo-sync"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"   # edition 2024 + let-chains
description = "Qiwo sync core library — WebDAV-based Rime configuration and user dictionary sync"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "rt", "sync"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
walkdir = "2"
# 流式上传（ReaderStream）与有界并发传输
tokio-util = { version = "0.7", default-features = false, features = ["io"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[lib]
name = "qiwo_sync"
crate-type = ["lib", "cdylib"]

[dev-dependencies]
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "macros"] }
